name: Bug report
description: Report a reproducible problem without sharing credentials or private question content.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, cookies, account names, private questions or unredacted logs."
  - type: dropdown
    id: path
    attributes:
      label: Product path
      options:
        - Local browser fixture/userscript
        - Windows desktop application
        - Site adapter maintained by a contributor
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact version, browser or Windows version, and a minimal public fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and sanitized log
    validations:
      required: true
